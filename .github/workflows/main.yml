name: 刷课

on:
  push:
    branches: [ main ]
    # 题库/缓存的回写提交不触发刷课, 防止 Actions 自己把自己叫起来
    paths-ignore:
      - 'tiku/**'
      - '**.md'
  # 定时刷课: 默认关闭(保持你原来的设置)。要每天自动刷就把下面两行前面的 # 去掉。
  # 注意 cron 用 UTC: "0 0 * * *" = 北京时间每天 08:00
  #schedule:
  #  - cron: "0 0 * * *"

  # ============ 手动触发: 在 Actions 页面点 "Run workflow" 就能跑 ============
  workflow_dispatch:
    inputs:
      course_list:
        description: '课程ID(逗号分隔)。留空=secrets 里的 CHAOXING_COURSE_LIST, 再留空=全部课程'
        required: false
        default: ''
      provider:
        description: '题库(留空=secrets 里的 TIKU_PROVIDER, 再留空=auto)。例: TikuLocal 或 TikuLocal,TikuGo,TikuYanxi'
        required: false
        default: ''
      submit:
        description: '是否提交章节检测答案(true/false)。留空=secrets 里的 TIKU_SUBMIT, 再留空=false(只搜答案不提交)'
        required: false
        default: ''
      speed:
        description: '视频倍速 1~2。留空=secrets 里的 CHAOXING_SPEED, 再留空=1'
        required: false
        default: ''
      jobs:
        description: '并发章节数。留空=secrets 里的 CHAOXING_JOBS, 再留空=4'
        required: false
        default: ''
      bank_url:
        description: '可选: 题库文件直链(json/txt), 运行前导入到 tiku/bank.json'
        required: false
        default: ''
      dry_run:
        description: '只检查配置与题库、不真正刷课(true/false)'
        required: false
        default: 'false'

# 同一分支只跑一个任务, 避免两次运行同时写题库
concurrency:
  group: chaoxing-${{ github.ref }}
  cancel-in-progress: false

# 回写 tiku/ 下的题库与缓存需要写权限
permissions:
  contents: write

jobs:
  Start:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      # ---------------- 账号 ----------------
      CHAOXING_USERNAME: ${{ secrets.CHAOXING_USERNAME }}
      CHAOXING_PASSWORD: ${{ secrets.CHAOXING_PASSWORD }}
      CHAOXING_COURSE_LIST: ${{ github.event.inputs.course_list || secrets.CHAOXING_COURSE_LIST }}
      CHAOXING_SPEED: ${{ github.event.inputs.speed || secrets.CHAOXING_SPEED }}
      CHAOXING_JOBS: ${{ github.event.inputs.jobs || secrets.CHAOXING_JOBS }}
      CHAOXING_NOTOPEN_ACTION: ${{ secrets.CHAOXING_NOTOPEN_ACTION }}

      # ---------------- 题库 ----------------
      # provider=auto 时按已配置的凭据自动组链: TikuLocal -> TikuGo -> 言溪 -> TikuAdapter -> 硅基流动 -> AI
      CHAOXING_TIKU_PROVIDER: ${{ github.event.inputs.provider || secrets.TIKU_PROVIDER || 'auto' }}
      CHAOXING_TIKU_SUBMIT: ${{ github.event.inputs.submit || secrets.TIKU_SUBMIT }}
      CHAOXING_TIKU_COVER_RATE: ${{ secrets.TIKU_COVER_RATE }}
      CHAOXING_TIKU_DELAY: ${{ secrets.TIKU_DELAY }}
      # 言溪题库 / LIKE知识库 token(逗号分隔)
      CHAOXING_TIKU_TOKENS: ${{ secrets.TIKU_TOKENS }}
      # TikuAdapter 或自建题库接口地址
      CHAOXING_TIKU_URL: ${{ secrets.TIKU_URL }}
      CHAOXING_TIKU_LOCAL_API: ${{ secrets.TIKU_LOCAL_API }}
      # GO题解除限流的 Authorization(可选)
      CHAOXING_TIKU_GO_AUTHORIZATION: ${{ secrets.TIKU_GO_AUTHORIZATION }}
      # 大模型题库(二选一即可)
      CHAOXING_TIKU_SILICONFLOW_KEY: ${{ secrets.TIKU_SILICONFLOW_KEY }}
      CHAOXING_TIKU_SILICONFLOW_MODEL: ${{ secrets.TIKU_SILICONFLOW_MODEL }}
      CHAOXING_TIKU_ENDPOINT: ${{ secrets.TIKU_ENDPOINT }}
      CHAOXING_TIKU_KEY: ${{ secrets.TIKU_KEY }}
      CHAOXING_TIKU_MODEL: ${{ secrets.TIKU_MODEL }}
      # 本地题库与答案缓存: 固定放在 tiku/ 下, 随仓库提交就能逐轮积累
      CHAOXING_TIKU_LOCAL_BANK: tiku/bank.json
      CHAOXING_TIKU_CACHE_FILE: tiku/cache.json
      CHAOXING_TIKU_EXPORT_BANK: 'true'

      # ---------------- 通知(可选) ----------------
      CHAOXING_NOTIFY_PROVIDER: ${{ secrets.NOTIFY_PROVIDER }}
      CHAOXING_NOTIFY_URL: ${{ secrets.NOTIFY_URL }}
      CHAOXING_NOTIFY_TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

    steps:
      - name: 拷贝代码
        uses: actions/checkout@v4

      - name: 设置python环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: 安装依赖包
        run: pip install -r ./requirements.txt

      - name: 自检(题库与配置单测)
        # 自检只做提示: 单测失败不该挡住刷课与题库回写(它曾经真的挡住过一整轮)
        continue-on-error: true
        run: |
          python -m unittest discover -s tests -t . || \
            echo "::warning::自检未通过, 已继续执行刷课(请把这一步的日志发给维护者)"

      - name: 生成 config.ini(从环境变量/secrets)
        run: |
          python scripts/gen_config.py --template config_template.ini --out config.ini --check
          python scripts/gen_config.py --template config_template.ini --out config.ini

      - name: 导入题库(可选, 仅手动触发填了 bank_url 时)
        if: ${{ github.event.inputs.bank_url != '' }}
        run: |
          curl -fsSL "${{ github.event.inputs.bank_url }}" -o /tmp/import_bank
          python scripts/tiku_tool.py import --bank tiku/bank.json --input /tmp/import_bank

      - name: 恢复题库缓存(备份手段)
        uses: actions/cache/restore@v4
        with:
          path: tiku/cache.json
          key: tiku-cache-${{ github.run_id }}
          restore-keys: |
            tiku-cache-

      - name: 运行刷课
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: python main.py --config config.ini -u "$CHAOXING_USERNAME" -p "$CHAOXING_PASSWORD" -l "$CHAOXING_COURSE_LIST"

      - name: 干跑(只检查配置与题库, 不刷课)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          python scripts/tiku_tool.py stats
          python scripts/tiku_tool.py lookup -q "以下哪个是网络层协议？" || true
          echo "干跑结束: 配置与题库都可用, 去掉 dry_run 即可真正刷课"

      - name: 题库回写(缓存合并进 tiku/bank.json)
        if: always()
        run: |
          mkdir -p tiku
          [ -f tiku/cache.json ] || echo '{}' > tiku/cache.json
          python scripts/tiku_tool.py export --cache tiku/cache.json --bank tiku/bank.json

      - name: 把题库/缓存提交回仓库
        if: always()
        run: |
          if [ -z "$(git status --porcelain tiku/)" ]; then
            echo "题库无变化, 无需提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tiku/
          git commit -m "chore(tiku): 自动回写题库与答案缓存 [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: 再次保存题库缓存(备份手段)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: tiku/cache.json
          key: tiku-cache-${{ github.run_id }}

      - name: 运行摘要(题目命中情况一目了然)
        if: always()
        run: |
          {
            echo "## 本次运行摘要"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 题库 provider | \`$CHAOXING_TIKU_PROVIDER\` |"
            echo "| 是否提交章节检测 | \`${CHAOXING_TIKU_SUBMIT:-false}\` |"
            echo "| 干跑 | \`${{ github.event.inputs.dry_run == 'true' }}\` |"
            echo ""
            echo "### 题库现状"
            echo '```'
            python scripts/tiku_tool.py stats 2>&1 || true
            echo '```'
            echo ""
            echo "### 命中与覆盖率(日志摘录)"
            echo '```'
            grep -aE "题库已启用|本地题库已加载|章节检测题库覆盖率|从缓存中获取答案|获取答案失败" chaoxing.log 2>/dev/null | tail -n 25 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传运行日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaoxing-log-${{ github.run_id }}
          path: chaoxing.log
          if-no-files-found: ignore

      - name: 失败时输出日志尾部
        if: failure()
        run: tail -n 100 chaoxing.log || true
